name: Build and Release Brush APK

# Packages reubeno/brush (https://github.com/reubeno/brush) as a signed
# Alpine (.apk) package, built from source and packaged using our own
# apk-builder container via the reusable build-apk.yml workflow
# (see bbusse/github-workflows).
#
# BRUSH_VERSION pins which upstream brush release we build against
# (upstream tags look like "brush-shell-vX.Y.Z"). Every push rebuilds the
# linux-*-musl binaries and re-publishes/updates the GitHub Release for that
# version under the same pkgrel (default r0) - PRs only get the
# compile-check build. This is a no-op repackage when nothing about the
# build actually changed, so pkgrel does NOT auto-increment on every push.
# Pushing a "vX.Y.Z" tag on this repo targets that brush version instead of
# the default pinned in this workflow's `brush_version` input.
# To deliberately force a new r-number for the *same* brush_version (e.g.
# after changing something about how we package it), run this workflow
# manually via workflow_dispatch with a bumped `brush_pkgrel`.
#
# Requires (already used by our other apk-producing repos):
#   secrets.ABUILD_PRIVATE_KEY  - PEM RSA key used to sign the .apk
#   vars.PACKAGER               - "Name <email>" packager string

on:
  push:
    branches: ["**"]
    tags:
      - 'v*'
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      brush_version:
        description: brush version to package (e.g. v0.4.0)
        required: false
        default: v0.4.0
        type: string
      brush_pkgrel:
        description: apk pkgrel to force for this brush_version (bump only when the packaging itself changed)
        required: false
        default: '0'
        type: string

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      brush_version: ${{ steps.v.outputs.version }}
      brush_ref: ${{ steps.v.outputs.ref }}
      brush_pkgrel: ${{ steps.v.outputs.pkgrel }}
    steps:
      - id: v
        run: |
          VERSION="${{ inputs.brush_version || 'v0.4.0' }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=brush-shell-$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkgrel=${{ inputs.brush_pkgrel || '0' }}" >> "$GITHUB_OUTPUT"

  build-linux-amd64-musl:
    needs: vars
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      ARTIFACT_SUFFIX: linux-amd64-musl
    steps:
      - name: Checkout brush
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reubeno/brush
          ref: ${{ needs.vars.outputs.brush_ref }}

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ env.TARGET }}" --bin brush

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/brush" "dist/brush-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/brush-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brush-${{ env.ARTIFACT_SUFFIX }}
          path: dist/brush-${{ env.ARTIFACT_SUFFIX }}

  build-linux-arm64-musl:
    needs: vars
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
      ARTIFACT_SUFFIX: linux-arm64-musl
      ZIG_VERSION: "0.16.0"
      ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
    steps:
      - name: Checkout brush
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reubeno/brush
          ref: ${{ needs.vars.outputs.brush_ref }}

      - name: Install Zig
        run: |
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          rm zig.tar.xz

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build release binary
        run: cargo zigbuild --release --locked --target "${{ env.TARGET }}" --bin brush

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ env.TARGET }}/release/brush" "dist/brush-${{ env.ARTIFACT_SUFFIX }}"
          chmod +x "dist/brush-${{ env.ARTIFACT_SUFFIX }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brush-${{ env.ARTIFACT_SUFFIX }}
          path: dist/brush-${{ env.ARTIFACT_SUFFIX }}

  build-apk:
    if: github.event_name == 'push'
    needs:
      - vars
      - build-linux-amd64-musl
      - build-linux-arm64-musl
    uses: bbusse/github-workflows/.github/workflows/build-apk.yml@dev
    with:
      artifact_name: brush
      binary_name: brush
      version: ${{ needs.vars.outputs.brush_version }}
      pkgrel: ${{ needs.vars.outputs.brush_pkgrel }}
      pkgdesc: bash/POSIX-compatible shell implemented in Rust
      pkgurl: https://github.com/reubeno/brush
      license: MIT
      key_name: apk-releases
      # Ship a brush-binsh subpackage alongside the plain one, mirroring
      # Alpine's busybox/busybox-binsh split. Only the subpackage claims
      # /bin/sh, so `apk add brush` stays a no-op for the system shell, while
      # `apk add brush-binsh` makes brush it -- and, because the claim is
      # declared as a provides, satisfies the /bin/sh file dependency that
      # alpine-baselayout carries. Without it that dependency can only be
      # met by busybox-binsh, so nothing can build an Alpine root that has
      # brush as its shell and no busybox.
      alt_subpackage: binsh
      provides: /bin/sh cmd:sh
      provider_priority: '100'
      symlinks: /bin/sh=/usr/bin/brush
    secrets: inherit

  release:
    if: github.event_name == 'push'
    needs:
      - vars
      - build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download amd64 apk
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brush-apk-amd64
          path: ./out/x86_64

      - name: Download arm64 apk
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brush-apk-arm64
          path: ./out/aarch64

      - name: Stage release files
        run: |
          # abuild's output filename doesn't encode arch, so prefix it
          # ourselves to keep both architectures' packages distinguishable
          # on the release page.
          mkdir -p ./release
          for f in ./out/x86_64/*.apk; do cp "$f" "./release/x86_64-$(basename "$f")"; done
          for f in ./out/aarch64/*.apk; do cp "$f" "./release/aarch64-$(basename "$f")"; done
          ls -lah ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.vars.outputs.brush_version }}
          name: brush ${{ needs.vars.outputs.brush_version }}
          files: ./release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
